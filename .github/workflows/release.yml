# 静态编译打包：CGO_ENABLED=0 + 纯 Go 依赖（modernc.org/sqlite），
# 产物为完全静态链接的单二进制，可直接部署到国产化 Linux 环境
# （鲲鹏/飞腾 arm64、龙芯 loong64、RISC-V、x86_64）。
# 同时构建多架构容器镜像并推送到 GHCR（不推 Docker Hub）。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux：生产部署（含国产化架构）
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: riscv64
          # macOS：本地测试（Intel/Apple Silicon）
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows：Windows Server 部署
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Web 界面 go:embed 进二进制，必须在 go build 之前构建产物。
      - name: Build web bundle
        run: make web

      - name: Test
        run: go test ./... -count=1

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/agenthub-${GOOS}-${GOARCH}${EXT}" ./cmd/agenthub

      - name: Verify static linkage
        if: matrix.goos == 'linux'
        run: |
          file "dist/agenthub-${{ matrix.goos }}-${{ matrix.goarch }}"
          # 静态链接校验：不允许出现 interpreter（动态链接器）。
          if readelf -l "dist/agenthub-${{ matrix.goos }}-${{ matrix.goarch }}" | grep -q "INTERP"; then
            echo "ERROR: binary is dynamically linked"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: agenthub-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # 多架构容器镜像：装配方言——二进制来自 binaries 矩阵产物，
  # scratch 运行层 + per-arch 构建推 + imagetools 组合 manifest，
  # 彻底绕开官方基础镜像不发布 loong64 的限制。
  image:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 装配方言：二进制来自 binaries 矩阵产物（Go 原生编译，覆盖全部架构），
      # 镜像内不再编译——绕开官方基础镜像不发布 loong64 的限制。
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: agenthub-linux-*
          merge-multiple: true
          path: bin

      # scratch 运行层的两件运行时依赖（架构无关），从官方 golang 镜像导出。
      - name: Prepare runtime certs and tzdata
        run: |
          mkdir -p certs
          docker create --name tz golang:1.26 true
          docker cp tz:/etc/ssl/certs/ca-certificates.crt certs/ca-certificates.crt
          docker cp tz:/usr/local/go/lib/time/zoneinfo.zip certs/zoneinfo.zip
          docker rm -f tz
          ls -la bin certs

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # tag 推送 → v1.2.3 / 1.2 / latest；手动触发 → sha 短哈希。
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      # scratch 装配架构无关，但 COPY 的二进制按平台不同：buildx 多平台
      # 一次构建需要镜像内编译（被基础镜像缺失挡死），因此按平台分次构建
      # 推 per-arch tag，再收集 digest 用 imagetools 组合多架构 manifest。
      - name: Build and push per-arch images
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          DIGESTS=""
          for ARCH in amd64 arm64 loong64 riscv64; do
            OUT=$(docker buildx build \
              --platform "linux/$ARCH" \
              --build-arg "BIN_NAME=bin/agenthub-linux-$ARCH" \
              --push $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ' | sed "s|$IMAGE|$IMAGE-$ARCH|g") .)
            # --push 模式从 stdout 抓 digest（最后一行 sha256:...）
            DIGEST=$(echo "$OUT" | grep -oE 'sha256:[a-f0-9]{64}' | tail -1)
            DIGESTS="$DIGESTS $IMAGE-$ARCH@$DIGEST"
            echo "$ARCH digest: $DIGEST"
          done
          echo "DIGESTS=$DIGESTS" >> "$GITHUB_ENV"

      - name: Create multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          for t in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            docker buildx imagetools create -t "$t" ${{ env.DIGESTS }}
          done
          docker buildx imagetools inspect "$IMAGE:latest" | head -20

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # download-artifact 连续两跑在重试 5 次后瞬时失败；
      # 改用 gh run download 包在 nick-fields/retry 里（3 次尝试，间隔 30s）。
      - name: Download artifacts (with retry)
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_seconds: 600
          command: |
            mkdir -p dist
            gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
              --pattern "agenthub-linux-*" --dir dist
            ls -la dist

      - name: Checksums
        run: |
          cd dist
          sha256sum agenthub-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agenthub-*
            dist/checksums.txt
          generate_release_notes: true
