# 常规 CI：测试 + vet + 前端类型检查；额外做一次 loong64 编译冒烟，
# 保证国产化目标不被日常提交破坏。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true

      - name: Build web bundle
        run: make web

      # 产物漂移守门：已提交的 web_dist 必须与"现在重新构建的结果"一致。
      # 失败模式是改了前端源码或依赖（package.json / vite.config.ts / tsconfig.json）
      # 却忘了跑 make web 就提交——此时产物与源码已经不同步。
      # CI 跑在干净 checkout 上，因此直接比较"重建后的产物"与 HEAD 中的产物。
      - name: Check embedded web bundle is up to date
        run: |
          if git diff --quiet HEAD -- internal/httpx/web_dist; then
            echo "web_dist is up to date"
            exit 0
          fi
          echo "::error::internal/httpx/web_dist does not match a fresh build."
          echo "Run 'make web' and commit the rebuilt bundle together with the source changes."
          git diff --stat HEAD -- internal/httpx/web_dist | head -20
          exit 1

      - name: Test
        run: go test ./... -count=1

      # 并发守门：连接替换、inflight/rate map、fleet reconcileMu 都是并发热点，
      # 普通 go test 检不出数据竞争。
      - name: Test with race detector
        run: go test ./... -race -count=1

      - name: Vet
        run: go vet ./...

      # 国产化守门：CGO_ENABLED=0 交叉编译 loong64 必须保持可行。
      - name: Cross-compile smoke (loong64, static)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: loong64
        run: |
          go build -trimpath -ldflags "-s -w" -o /tmp/agenthub-loong64 ./cmd/agenthub
          if readelf -l /tmp/agenthub-loong64 | grep -q "INTERP"; then
            echo "ERROR: binary is dynamically linked"; exit 1
          fi

      # 容器构建冒烟：Dockerfile 保持可构建（不推送）。
      # 必须先备齐 Dockerfile COPY 所需的 bin/ 与 certs/——之前这里直接
      # `docker build .`，而仓库里没有这两个目录，冒烟要么红要么被跳过，
      # 等于 Dockerfile 从未被真实验证过。
      - name: Docker build smoke
        run: |
          mkdir -p bin certs
          # 显式指定 GOOS/GOARCH：镜像里必须是 linux/amd64，不能依赖
          # runner 的隐含环境，否则容器启动会报 exec 格式错误。
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o bin/agenthub-linux-amd64 ./cmd/agenthub
          docker create --name certs-src golang:1.26 true >/dev/null
          docker cp certs-src:/etc/ssl/certs/ca-certificates.crt certs/ca-certificates.crt
          docker cp certs-src:/usr/local/go/lib/time/zoneinfo.zip certs/zoneinfo.zip
          docker rm -f certs-src >/dev/null
          # 构建后确认二进制真的进了镜像层——.dockerignore 的忽略模式对
          # 任意层级生效，写错会让 COPY 静默拿到缺失文件。
          docker build -t agenthub:ci-smoke .
          # 冒烟要真的能起来：HUB_PUBLIC_URL 用环回地址满足 config 校验。
          docker run -d --name agenthub-smoke -p 8787:8787 \
            -e HUB_PUBLIC_URL=http://127.0.0.1:8787 agenthub:ci-smoke
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8787/healthz >/dev/null; then
              echo "container is healthy"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/healthz >/dev/null || {
            echo "ERROR: container did not become healthy"; docker logs agenthub-smoke; exit 1;
          }
          # 内嵌静态资源（go:embed 的 web_dist）必须能取到，否则前端白屏。
          curl -sf -o /dev/null http://127.0.0.1:8787/fonts/fonts.css || {
            echo "ERROR: embedded web assets are not served"; exit 1;
          }
          docker rm -f agenthub-smoke >/dev/null
